
name: Rick and Morty CI/CD

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

jobs:
  test:
    name: Run Tests and Deploy
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Run Tests
        run: python -m pytest -v

      - name: Build Docker Image
        run: docker build -t rick-and-morty-api:ci .

      - name: Create Kubernetes Cluster
        uses: helm/kind-action@v1.15.1

      - name: Load Docker Image into Kind
        run: kind load docker-image rick-and-morty-api:ci --name chart-testing

      - name: Setup Helm
        uses: azure/setup-helm@v4

      - name: Deploy Application with Helm
        run: |
          helm upgrade --install my-rick-app ./helm/rick-and-morty \
            --set image.repository=rick-and-morty-api \
            --set image.tag=ci \
            --set image.pullPolicy=IfNotPresent \
            --set ingress.enabled=false

      - name: Wait for Deployment
        run: kubectl rollout status deployment/my-rick-app-api --timeout=120s

      - name: Test Application Endpoints
        run: |
          kubectl port-forward service/my-rick-app-service 8080:80 > /tmp/port-forward.log 2>&1 &

          for i in {1..20}; do
            if curl -s http://localhost:8080/healthcheck > /dev/null; then
              break
            fi
            sleep 2
          done

          curl --fail http://localhost:8080/healthcheck
          curl --fail http://localhost:8080/characters

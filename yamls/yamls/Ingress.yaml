apiVersion: networking.k8s.io/v1
kind: Ingress

metadata:
  name: rick-and-morty-ingress

spec:
  ingressClassName: nginx

  rules:
    - host: rickmorty.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: rick-and-morty-service
                port:
                  number: 80
